<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Action Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>Night Action Tracker</h1>
    <p id="status" class="status">Enter a game PIN to view its actions.</p>
  </header>

  <main>
    <section id="gate" class="gate">
      <label class="field">
        <span class="field-label">Game</span>
        <select id="game-select"></select>
      </label>
      <label class="field">
        <span class="field-label">PIN</span>
        <input id="pin-input" type="password" autocomplete="off" placeholder="game PIN" />
      </label>
      <button id="unlock-btn" type="button" class="primary">View actions</button>
      <p id="gate-error" class="gate-error"></p>
    </section>

    <section id="board" hidden>
      <div class="toolbar">
        <div id="night-tabs" class="night-tabs"></div>
        <div class="spacer"></div>
        <button id="view-toggle" type="button" class="ghost">List view</button>
      </div>

      <div id="web-view" class="web-view">
        <div class="graph-wrap">
          <svg id="graph" viewBox="0 0 900 640" role="img" aria-label="Night action graph"></svg>
          <div id="legend" class="graph-legend"></div>
        </div>
        <aside id="details" class="details">
          <p class="details-hint">Hover a player to see their action.</p>
        </aside>
      </div>

      <div id="list-view" class="table-wrap" hidden>
        <table>
          <thead>
            <tr>
              <th>Night</th><th>Channel</th><th>Submitted by</th>
              <th>Role</th><th>Target</th><th>Raw message</th><th>Time</th>
            </tr>
          </thead>
          <tbody id="submissions-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
