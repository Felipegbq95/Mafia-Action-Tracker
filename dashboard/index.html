<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Action Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>Night Action Tracker</h1>
    <p id="status" class="status"></p>
  </header>

  <main>
    <!-- Landing: list games + create -->
    <section id="landing">
      <div class="panel">
        <h2>Games</h2>
        <div id="game-list" class="game-list"></div>
      </div>
      <div class="panel">
        <h2>New game</h2>
        <div class="create-row">
          <input id="new-name" placeholder="Game name" />
          <input id="new-pin" type="password" placeholder="PIN (6+ chars)" autocomplete="off" />
          <button id="create-btn" class="primary" type="button">Create</button>
        </div>
        <p id="landing-error" class="gate-error"></p>
      </div>
    </section>

    <!-- A single game (editor or public read-only) -->
    <section id="game" hidden>
      <div class="game-bar">
        <button id="back-btn" class="ghost" type="button">&larr; Games</button>
        <h2 id="game-name"></h2>
        <span id="ro-badge" class="ro-badge" hidden>read-only</span>
        <div class="spacer"></div>
        <div id="night-tabs" class="night-tabs"></div>
        <button id="finish-btn" class="ghost danger" type="button" hidden>Finish game</button>
      </div>
      <nav id="tabs" class="tabs"></nav>
      <div id="panel"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
