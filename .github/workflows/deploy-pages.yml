name: Deploy dashboard to GitHub Pages

on:
  push:
    # This repo's default branch is the claude/ branch (there is no main yet).
    # Deploy from whichever exists so Pages updates on every push.
    branches: [main, claude/mafia-action-tracker-n9iu41]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Copies the entire dashboard/ directory rather than naming files
      # individually - a file-whitelist here is a trap (new assets silently
      # never make it to the live site if this list isn't updated too).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
