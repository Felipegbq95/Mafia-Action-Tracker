name: Scrape night actions

on:
  # Manual/backup entrypoint - run from the Actions tab any time. The primary
  # way to scrape is the "Scrape now" button in the dashboard (a Supabase
  # Edge Function, see GO-LIVE.md 3a); this workflow is a fallback that
  # doesn't need the dashboard open.
  workflow_dispatch: {}
  # No schedule trigger by default (a YAML-level `schedule:` here would run
  # every few minutes with no way to turn it off short of removing it or
  # disabling the whole workflow). Uncomment to poll on a timer instead of
  # using the button - GitHub's scheduler has a ~5 minute floor and runs
  # best-effort, so it's near-live, not instant:
  # schedule:
  #   - cron: '*/5 * * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - run: npm run scrape
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
